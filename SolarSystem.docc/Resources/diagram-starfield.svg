<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">별 배경은 안쪽을 향한 큰 구입니다</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">구를 좌우로 뒤집어 이미지가 안쪽을 보게 만들고, 그 한가운데에 사람이 섭니다.</text>

  <g>
    <circle cx="250" cy="250" r="110" fill="none" stroke="#3a4152" stroke-width="3"/>
    <circle cx="250" cy="250" r="103" fill="none" stroke="#4d7fb3" stroke-width="6" opacity="0.35"/>
    <circle cx="250" cy="250" r="12" fill="#7fd1ff"/>
    <text x="250" y="292" fill="#f5f5f7" font-size="14" text-anchor="middle">사람</text>
    <g stroke="#8ce99a" stroke-width="2">
      <path d="M250 250 L250 158"/>
      <path d="M250 250 L318 182"/>
      <path d="M250 250 L342 250"/>
      <path d="M250 250 L318 318"/>
    </g>
    <text x="250" y="392" fill="#6b7280" font-size="13" text-anchor="middle">반지름 1000의 구 안쪽</text>
  </g>

  <g>
    <rect x="430" y="140" width="330" height="86" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="452" y="172" fill="#8ce99a" font-size="14">entity.scale *= [-1, 1, 1]</text>
    <text x="452" y="202" fill="#9aa0aa" font-size="14">좌우를 뒤집어 이미지를 안쪽으로</text>
  </g>

  <g>
    <rect x="430" y="248" width="330" height="86" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="452" y="280" fill="#ffd479" font-size="14">UnlitMaterial</text>
    <text x="452" y="310" fill="#9aa0aa" font-size="14">빛의 영향을 받지 않아 늘 같은 밝기</text>
  </g>
</svg>
