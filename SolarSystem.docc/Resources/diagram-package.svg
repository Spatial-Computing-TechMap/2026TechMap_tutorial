<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="380" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">3D 에셋은 별도의 패키지가 관리합니다</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">용량이 큰 모델을 앱 코드와 분리하고, Reality Composer Pro로 따로 열어 편집합니다.</text>

  <g>
    <rect x="50" y="130" width="300" height="180" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="72" y="162" fill="#7fd1ff" font-size="13" font-weight="600">앱 타깃</text>
    <text x="72" y="194" fill="#f5f5f7" font-size="16">SolarSystem</text>
    <text x="72" y="222" fill="#9aa0aa" font-size="14">Swift 코드 · SwiftUI 뷰</text>
    <text x="72" y="266" fill="#8ce99a" font-size="14">Entity(named:in:)</text>
    <text x="72" y="290" fill="#6b7280" font-size="13">이름으로 모델을 요청</text>
  </g>

  <g>
    <path d="M360 220 H440" stroke="#5a6478" stroke-width="2"/>
    <path d="M432 214 l10 6 -10 6 z" fill="#5a6478"/>
  </g>

  <g>
    <rect x="450" y="130" width="300" height="180" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="472" y="162" fill="#ffd479" font-size="13" font-weight="600">로컬 Swift 패키지</text>
    <text x="472" y="194" fill="#f5f5f7" font-size="16">SolarSystemAssets</text>
    <text x="472" y="222" fill="#9aa0aa" font-size="14">SolarSystemAssets.rkassets/</text>
    <text x="492" y="248" fill="#9aa0aa" font-size="14">Planets/ · Earth · Sun</text>
    <text x="472" y="290" fill="#6b7280" font-size="13">Package.realitycomposerpro 로 편집</text>
  </g>

  <text x="40" y="358" fill="#6b7280" font-size="13">앱 타깃의 General &gt; Frameworks, Libraries, and Embedded Content 에 연결되어 있어야 합니다.</text>
