<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="430" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">부모를 바꿔 확대 자리로 옮기기</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">addChild(_:preservingWorldTransform:)는 보이는 위치를 유지한 채 부모만 바꿉니다.</text>

  <g>
    <text x="150" y="132" fill="#6b7280" font-size="13" text-anchor="middle">고르기 전</text>
    <rect x="50" y="150" width="200" height="200" rx="14" fill="#191d26" stroke="#2c3240"/>
    <circle cx="150" cy="250" r="10" fill="#ffd479"/>
    <circle cx="150" cy="250" r="66" fill="none" stroke="#3a4152" stroke-dasharray="4 6"/>
    <circle cx="204" cy="212" r="14" fill="#c8612f"/>
    <text x="150" y="336" fill="#9aa0aa" font-size="13" text-anchor="middle">부모: radiusOffset</text>
  </g>

  <g>
    <path d="M270 250 H330" stroke="#7fd1ff" stroke-width="2"/>
    <path d="M322 244 l10 6 -10 6 z" fill="#7fd1ff"/>
    <text x="300" y="232" fill="#7fd1ff" font-size="13" text-anchor="middle">핀치</text>
  </g>

  <g>
    <text x="450" y="132" fill="#6b7280" font-size="13" text-anchor="middle">옮긴 직후 (위치 그대로)</text>
    <rect x="350" y="150" width="200" height="200" rx="14" fill="#191d26" stroke="#2c3240"/>
    <circle cx="404" cy="212" r="14" fill="#c8612f"/>
    <circle cx="450" cy="250" r="4" fill="#4d7fb3"/>
    <path d="M404 212 L446 246" stroke="#4d7fb3" stroke-width="1.5" stroke-dasharray="3 4"/>
    <text x="450" y="336" fill="#9aa0aa" font-size="13" text-anchor="middle">부모: FocusStage</text>
  </g>

  <g>
    <path d="M570 250 H630" stroke="#8ce99a" stroke-width="2"/>
    <path d="M622 244 l10 6 -10 6 z" fill="#8ce99a"/>
    <text x="600" y="232" fill="#8ce99a" font-size="13" text-anchor="middle">0.6초</text>
  </g>

  <g>
    <text x="750" y="132" fill="#6b7280" font-size="13" text-anchor="end">애니메이션 뒤</text>
    <rect x="650" y="150" width="110" height="200" rx="14" fill="#191d26" stroke="#2c3240"/>
    <circle cx="705" cy="250" r="40" fill="#c8612f"/>
    <text x="705" y="336" fill="#9aa0aa" font-size="13" text-anchor="middle">자리 한가운데</text>
  </g>

  <text x="40" y="392" fill="#9aa0aa" font-size="14">그냥 addChild를 쓰면 행성이 순간이동하듯 튑니다.</text>
  <text x="40" y="416" fill="#6b7280" font-size="13">확대한 동안에는 공전을 멈춰야 그 자리에 머뭅니다. 자전은 그대로 둡니다.</text>
</svg>
