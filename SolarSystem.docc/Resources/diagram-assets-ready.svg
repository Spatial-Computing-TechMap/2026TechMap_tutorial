<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="610" viewBox="0 0 1080 610" font-family="-apple-system, BlinkMacSystemFont, Apple SD Gothic Neo, sans-serif">
<rect width="1080" height="610" rx="24" fill="#121824"/>
<text x="40" y="57" font-size="29" fill="#e8edf5" font-weight="600">별 배경과 모델을 각각 연결합니다</text>
<text x="40" y="95" font-size="20" fill="#aebed2" font-weight="400">이미지는 앱의 에셋 카탈로그에, 모델은 로컬 Swift 패키지에 있습니다.</text>
<rect x="36" y="125" width="485" height="405" rx="16" fill="#1c2432" stroke="#354154"/>
<text x="60" y="167" font-size="23" fill="#7dcfff" font-weight="600">01  별 배경</text>
<text x="60" y="216" font-size="20" fill="#e8edf5" font-weight="400">SolarSystem/Assets.xcassets/</text>
<text x="60" y="257" font-size="20" fill="#e8edf5" font-weight="400">    Starfield.imageset/</text>
<text x="60" y="298" font-size="20" fill="#e8edf5" font-weight="400">        Starfield.jpg</text>
<text x="60" y="339" font-size="20" fill="#e8edf5" font-weight="400"></text>
<text x="60" y="380" font-size="20" fill="#e8edf5" font-weight="400">이미지 세트 이름: Starfield</text>
<rect x="545" y="125" width="499" height="405" rx="16" fill="#1c2432" stroke="#354154"/>
<text x="569" y="167" font-size="23" fill="#7dcfff" font-weight="600">02  태양과 여덟 행성</text>
<text x="569" y="216" font-size="20" fill="#e8edf5" font-weight="400">Packages/SolarSystemAssets/</text>
<text x="569" y="257" font-size="20" fill="#e8edf5" font-weight="400">    Package.swift</text>
<text x="569" y="298" font-size="20" fill="#e8edf5" font-weight="400">    Sources/SolarSystemAssets/</text>
<text x="569" y="339" font-size="20" fill="#e8edf5" font-weight="400">        SolarSystemAssets.rkassets/</text>
<text x="569" y="380" font-size="20" fill="#e8edf5" font-weight="400"></text>
<text x="569" y="421" font-size="20" fill="#e8edf5" font-weight="400">앱 타깃에 SolarSystemAssets 연결</text>
<text x="40" y="580" font-size="19" fill="#aebed2" font-weight="400">패키지 안의 모델 배치는 이미 완료되어 있습니다. 폴더 전체를 연결하세요.</text>
</svg>