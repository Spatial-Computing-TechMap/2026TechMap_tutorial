<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="430" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">궤도 간격 정하기</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">두 행성이 스쳐 지나가도 닿지 않으려면 반지름의 합보다 넓어야 합니다.</text>

  <line x1="60" y1="210" x2="740" y2="210" stroke="#2c3240" stroke-width="2"/>

  <g>
    <circle cx="200" cy="210" r="34" fill="#a8763e"/>
    <text x="200" y="278" fill="#f5f5f7" font-size="15" text-anchor="middle">목성</text>
    <text x="200" y="300" fill="#6b7280" font-size="13" text-anchor="middle">반지름 0.42</text>
    <line x1="200" y1="210" x2="234" y2="210" stroke="#ffd479" stroke-width="2"/>
  </g>

  <g>
    <ellipse cx="560" cy="210" rx="76" ry="16" fill="none" stroke="#c9b27a" stroke-width="5"/>
    <circle cx="560" cy="210" r="31" fill="#c9b27a"/>
    <text x="560" y="278" fill="#f5f5f7" font-size="15" text-anchor="middle">토성</text>
    <text x="560" y="300" fill="#6b7280" font-size="13" text-anchor="middle">본체 0.38 · 고리까지 0.89</text>
  </g>

  <g>
    <line x1="234" y1="160" x2="484" y2="160" stroke="#8ce99a" stroke-width="2"/>
    <line x1="234" y1="152" x2="234" y2="168" stroke="#8ce99a" stroke-width="2"/>
    <line x1="484" y1="152" x2="484" y2="168" stroke="#8ce99a" stroke-width="2"/>
    <text x="359" y="146" fill="#8ce99a" font-size="14" text-anchor="middle">여유 0.15 이상</text>
  </g>

  <g>
    <line x1="200" y1="340" x2="560" y2="340" stroke="#7fd1ff" stroke-width="2"/>
    <line x1="200" y1="332" x2="200" y2="348" stroke="#7fd1ff" stroke-width="2"/>
    <line x1="560" y1="332" x2="560" y2="348" stroke="#7fd1ff" stroke-width="2"/>
    <text x="380" y="330" fill="#7fd1ff" font-size="14" text-anchor="middle">궤도 사이 거리 1.5 (4.25 → 5.75)</text>
  </g>

  <text x="40" y="392" fill="#9aa0aa" font-size="14">필요한 최소 거리 = 0.42 (목성) + 0.15 (여유) + 0.89 (토성 고리) = 1.46</text>
  <text x="40" y="416" fill="#6b7280" font-size="13">토성은 고리가 본체의 두 배 넘게 퍼져 있어, 본체 크기만 보고 잡으면 겹칩니다.</text>
</svg>
