<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" width="800" height="430" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="430" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">시선으로 겨냥하고 핀치로 실행하기</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">시선은 앱에 전달되지 않습니다. 앱은 핀치가 끝난 뒤 무엇이 선택됐는지만 받습니다.</text>

  <g>
    <rect x="40" y="120" width="340" height="150" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="64" y="152" fill="#7fd1ff" font-size="13" font-weight="600">시스템이 아는 것</text>
    <text x="64" y="184" fill="#f5f5f7" font-size="15">지금 어디를 보고 있는지</text>
    <text x="64" y="212" fill="#f5f5f7" font-size="15">손가락이 맞닿았는지</text>
    <text x="64" y="246" fill="#6b7280" font-size="13">바라보는 물체를 은은하게 밝혀 줌</text>
  </g>

  <g>
    <rect x="420" y="120" width="340" height="150" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="444" y="152" fill="#ffd479" font-size="13" font-weight="600">앱이 받는 것</text>
    <text x="444" y="184" fill="#f5f5f7" font-size="15">핀치가 끝났다는 사실</text>
    <text x="444" y="212" fill="#f5f5f7" font-size="15">그때 선택된 엔티티</text>
    <text x="444" y="246" fill="#6b7280" font-size="13">어디를 보고 있었는지는 알 수 없음</text>
  </g>

  <g>
    <rect x="40" y="300" width="720" height="98" rx="14" fill="#191d26" stroke="#2c3240"/>
    <text x="64" y="332" fill="#f5f5f7" font-size="15" font-weight="600">선택 가능한 엔티티에 붙여야 하는 것</text>
    <text x="64" y="362" fill="#8ce99a" font-size="14">InputTargetComponent</text>
    <text x="260" y="362" fill="#9aa0aa" font-size="14">입력을 받겠다는 표시</text>
    <text x="64" y="386" fill="#8ce99a" font-size="14">CollisionComponent</text>
    <text x="260" y="386" fill="#9aa0aa" font-size="14">어디까지가 그 물체인지 정하는 영역 — 없으면 선택되지 않음</text>
  </g>
</svg>
