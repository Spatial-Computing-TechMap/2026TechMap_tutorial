<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="-apple-system, 'SF Pro Text', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif">
  <rect width="800" height="400" rx="20" fill="#14161c"/>
  <text x="40" y="56" fill="#f5f5f7" font-size="24" font-weight="600">전체 몰입 공간에는 기본 조명이 없습니다</text>
  <text x="40" y="86" fill="#9aa0aa" font-size="15">주변 현실이 완전히 가려지므로, 빛도 앱이 직접 만들어야 합니다.</text>

  <g>
    <circle cx="230" cy="250" r="40" fill="#ffd479"/>
    <g stroke="#ffd479" stroke-width="2" opacity="0.5">
      <path d="M230 190 V150"/><path d="M230 310 V350"/>
      <path d="M170 250 H130"/><path d="M290 250 H330"/>
      <path d="M188 208 L160 180"/><path d="M272 292 L300 320"/>
      <path d="M272 208 L300 180"/><path d="M188 292 L160 320"/>
    </g>
    <circle cx="230" cy="250" r="120" fill="none" stroke="#ffd479" stroke-width="1" opacity="0.25" stroke-dasharray="4 6"/>
    <text x="230" y="392" fill="#6b7280" font-size="13" text-anchor="middle">attenuationRadius — 빛이 닿는 거리</text>
  </g>

  <g>
    <rect x="420" y="140" width="340" height="96" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="444" y="172" fill="#ffd479" font-size="14" font-weight="600">PointLightComponent</text>
    <text x="444" y="200" fill="#9aa0aa" font-size="14">한 점에서 사방으로 퍼지는 빛</text>
    <text x="444" y="222" fill="#6b7280" font-size="13">intensity 200,000 · attenuationRadius 60</text>
  </g>

  <g>
    <rect x="420" y="256" width="340" height="96" rx="14" fill="#191d26" stroke="#2c3240"/>
    <text x="444" y="288" fill="#f5f5f7" font-size="14" font-weight="600">빛은 모델과 따로 둡니다</text>
    <text x="444" y="316" fill="#9aa0aa" font-size="14">자식으로 붙이면 모델을 키울 때</text>
    <text x="444" y="338" fill="#9aa0aa" font-size="14">빛이 닿는 거리도 함께 늘어납니다</text>
  </g>
</svg>
