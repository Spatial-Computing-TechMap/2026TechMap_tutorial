    <text x="82" y="220" fill="#9aa0aa" font-size="14">여닫는 버튼</text>
  </g>

  <g>
    <rect x="490" y="130" width="250" height="110" rx="14" fill="#1f2430" stroke="#3a4152"/>
    <text x="512" y="164" fill="#ffd479" font-size="13" font-weight="600">ImmersiveSpace</text>
    <text x="512" y="194" fill="#f5f5f7" font-size="16">주변 전체를 쓰는 공간</text>
    <text x="512" y="220" fill="#9aa0aa" font-size="14">태양계가 보이는 곳</text>
  </g>

  <g>
    <rect x="270" y="286" width="260" height="76" rx="14" fill="#191d26" stroke="#8ce99a"/>
